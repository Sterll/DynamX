plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${version_major}.${version_minor}.${version_patch}-mc${minecraft_version}"
group = 'fr.dynamx'
base {
    archivesName = 'DynamX'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava.options.encoding = 'UTF-8'

minecraft {
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', 'dynamx'
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', 'dynamx'
        programArgument '--nogui'
    }
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', 'dynamx'
    }
    data {
        programArguments.addAll '--mod', 'dynamx', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDirs += [ 'src/generated/resources' ]

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.spongepowered.org/maven' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://jitpack.io' }
    flatDir { dir 'libs' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    implementation "com.github.stephengold:Libbulletjme:${libbulletjme_version}"
    implementation "org.joml:joml:${joml_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

mixin {
    config 'mixins.dynamxmod.json'
    add sourceSets.main, 'refmap.dynamxmod.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neoforge_version           : neoforge_version,
            neoforge_version_range     : neoforge_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : project.version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
